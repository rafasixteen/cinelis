version: '3'

tasks:
    default:
        desc: Open the CineLis Android developer menu
        cmds:
            - task: tui

    setup:
        desc: Install the Android SDK packages required by CineLis
        cmds:
            - mise run android:setup

    tui:
        desc: Open the CineLis Android developer menu
        dir: ../tools/android/tui
        cmds:
            - go run .
