version: '3'

includes:
  api:
    taskfile: ./api/Taskfile.yml
    dir: ./api
  docs:
    taskfile: ./docs/Taskfile.yml
    dir: ./docs
  bo:
    taskfile: ./backoffice/Taskfile.yml
    dir: ./backoffice
  infra:
    taskfile: ./infra/Taskfile.yml
    dir: ./infra
  fo:
    taskfile: ./frontoffice/Taskfile.yml
    dir: ./frontoffice
  migrations:
    taskfile: ./console/Taskfile.yml
    dir: .
    flatten: true

dotenv: ['.env']

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true
