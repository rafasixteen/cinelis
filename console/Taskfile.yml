version: '3'

tasks:
    migrate:
        desc: Run pending database migrations
        cmds:
            - php yii migrate

    migrate:create:
        desc: Create a database migration (pass its name after --)
        preconditions:
            - sh: >-
                  php -r "exit(trim('{{.CLI_ARGS}}') === '' ? 1 : 0);"
              msg: 'Usage: task migrate:create -- migration_name'
        cmds:
            - php yii migrate/create {{.CLI_ARGS}}

    migrate:down:
        desc: Revert the last database migration
        cmds:
            - php yii migrate/down

    migrate:status:
        desc: Show migration history
        cmds:
            - php yii migrate/history
