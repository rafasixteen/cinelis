defaults:
    autostart: true

tasks:
    server:
        cmd:
            - php
            - -S
            - 127.0.0.1:8001
            - -t
            - web

    tailwind:
        cmd:
            - tailwindcss
            - -i
            - assets/css/globals.css
            - -o
            - web/css/globals.css
            - --watch
