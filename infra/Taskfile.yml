version: '3'

vars:
    COMPOSE: docker compose --env-file ../.env -f dev/compose.yml

tasks:
    up:
        desc: Start the development infrastructure
        cmds:
            - '{{.COMPOSE}} up -d --build'

    down:
        desc: Stop the development infrastructure
        cmds:
            - '{{.COMPOSE}} down'

    restart:
        desc: Restart the development infrastructure and refresh published assets
        cmds:
            - '{{.COMPOSE}} down'
            - docker volume rm cinelis_dev_cinelis-frontoffice-assets 2>/dev/null || true
            - '{{.COMPOSE}} up -d --build --force-recreate --remove-orphans'

    logs:
        desc: Follow development infrastructure logs
        cmds:
            - '{{.COMPOSE}} logs -f'

    ps:
        desc: Show development infrastructure status
        cmds:
            - '{{.COMPOSE}} ps'
