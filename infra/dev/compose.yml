services:
    postgres:
        ports:
            - "127.0.0.1:5432:${DB_CONTAINER_PORT:-5432}"

    api:
        image: cinelis-api-php-fpm:dev
        env_file:
            - ../.env
        environment:
            APP_ENV: development
            YII_DEBUG: "1"
            YII_ENV: dev
        build:
            args:
                COMPOSER_DEV_DEPENDENCIES: "true"
        volumes:
            - ../common:/var/www/cinelis/common:ro
            - ../api:/var/www/cinelis/api:ro
        develop:
            watch:
                - action: rebuild
                  path: ../composer.json
                - action: rebuild
                  path: ../composer.lock
                - action: rebuild
                  path: docker/php-fpm/Dockerfile

    backoffice:
        image: cinelis-backoffice-php-fpm:dev
        env_file:
            - ../.env
        environment:
            APP_ENV: development
            YII_DEBUG: "1"
            YII_ENV: dev
        build:
            args:
                COMPOSER_DEV_DEPENDENCIES: "true"
        volumes:
            - ../common:/var/www/cinelis/common:ro
            - ../backoffice:/var/www/cinelis/backoffice:ro
        develop:
            watch:
                - action: rebuild
                  path: ../composer.json
                - action: rebuild
                  path: ../composer.lock
                - action: rebuild
                  path: docker/php-fpm/Dockerfile

    frontoffice:
        image: cinelis-frontoffice-php-fpm:dev
        env_file:
            - ../.env
        environment:
            APP_ENV: development
            YII_DEBUG: "1"
            YII_ENV: dev
        build:
            args:
                COMPOSER_DEV_DEPENDENCIES: "true"
        volumes:
            - ../common:/var/www/cinelis/common:ro
            - ../frontoffice:/var/www/cinelis/frontoffice:ro
        develop:
            watch:
                - action: rebuild
                  path: ../composer.json
                - action: rebuild
                  path: ../composer.lock
                - action: rebuild
                  path: docker/php-fpm/Dockerfile

    caddy:
        ports:
            - "127.0.0.1:${CADDY_HTTP_PORT:-80}:80"
        volumes:
            - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
            - ../api/web:/var/www/cinelis/api/web:ro
            - ../backoffice/web:/var/www/cinelis/backoffice/web:ro
            - ../frontoffice/web:/var/www/cinelis/frontoffice/web:ro
